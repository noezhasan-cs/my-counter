<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESP32 Control Panel</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:#f5f5f5;
    margin:20px;
}

.card{
    background:white;
    padding:20px;
    margin:15px auto;
    max-width:500px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}

button{
    padding:15px 25px;
    margin:5px;
    font-size:18px;
    cursor:pointer;
}

input[type=range]{
    width:90%;
}

#danger{
    font-size:24px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>ESP32 Control Panel</h1>

<div class="card">

<h2>Motor 1 Direction</h2>

<button onclick="setDirection('left')">⬅ Left</button>

<button onclick="setDirection('stop')">⏹ Stop</button>

<button onclick="setDirection('right')">Right ➡</button>

<br><br>

<h3>Motor 1 Speed</h3>

<input type="range"
       min="0"
       max="255"
       value="0"
       id="motor1Speed"
       oninput="updateMotor1Speed(this.value)">

<p id="speed1Text">0</p>

</div>

<div class="card">

<h2>Motor 2 Speed</h2>

<input type="range"
       min="0"
       max="255"
       value="0"
       id="motor2Speed"
       oninput="updateMotor2Speed(this.value)">

<p id="speed2Text">0</p>

</div>

<div class="card">

<h2>Gas Sensor</h2>

<h1 id="gasValue">0</h1>

<div id="danger">SAFE</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
set,
onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDAgAK7PwlBkizQ5CCAbGqfgsaDqFLiX2s",
  authDomain: "esp32-new-control.firebaseapp.com",
  databaseURL: "https://esp32-new-control-default-rtdb.firebaseio.com",
  projectId: "esp32-new-control",
  storageBucket: "esp32-new-control.firebasestorage.app",
  messagingSenderId: "325766279015",
  appId: "1:325766279015:web:eb98abac2595f618c6c9c2",
  measurementId: "G-RG1PDT062L"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.setDirection = function(direction){

set(
ref(db,"motors/motor1/direction"),
direction
);

}

window.updateMotor1Speed = function(speed){

document.getElementById("speed1Text").innerText = speed;

set(
ref(db,"motors/motor1/speed"),
parseInt(speed)
);

}

window.updateMotor2Speed = function(speed){

document.getElementById("speed2Text").innerText = speed;

set(
ref(db,"motors/motor2/speed"),
parseInt(speed)
);

}

onValue(
ref(db,"system/gas_level"),
(snapshot)=>{

document.getElementById("gasValue").innerText =
snapshot.val();

}
);

onValue(
ref(db,"system/is_danger"),
(snapshot)=>{

let danger = snapshot.val();

if(danger){

document.getElementById("danger").innerHTML =
"⚠ DANGER";

document.getElementById("danger").style.color =
"red";

}
else{

document.getElementById("danger").innerHTML =
"✅ SAFE";

document.getElementById("danger").style.color =
"green";

}

}
);

</script>

</body>
</html>
